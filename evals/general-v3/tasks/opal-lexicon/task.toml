schema_version = "1.4"

[metadata]
difficulty = "hard"
category = "data_science"
verifier_kind = "executes-deliverable"
deliverables = [
    "/app/vocab_lib.py",
    "/app/build_vocab.py",
    "/app/vocab.txt",
    "/app/embeddings.csv",
    "/app/vocab.pkl",
]
tags = [
    "opal-lexicon",
    "data_science",
    "C-15759d2a",
    "vocabulary-serialization",
    "pickle-dataclass",
    "deterministic-build",
]

[verifier]
timeout_sec = 300.0

[agent]
timeout_sec = 1200.0

[environment]
build_timeout_sec = 600.0
cpus = 1
memory_mb = 2048
storage_mb = 4096
