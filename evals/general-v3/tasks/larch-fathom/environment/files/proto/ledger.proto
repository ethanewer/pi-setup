// ledger.proto -- schema for the Hopper billing ledger RPC surface.
// The data team needs Python bindings generated from this definition into a
// target directory so the ledger client can send and settle transactions.
syntax = "proto3";
package ledger;

message Transaction {
  string txn_id = 1;
  string account = 2;
  int64 amount_nanos = 3;
  string memo = 4;
}

message SettleRequest {
  string batch_id = 1;
  repeated Transaction txns = 2;
  bool dry_run = 3;
}

message SettledReply {
  bool ok = 1;
  string batch_id = 2;
  int32 accepted = 3;
  int32 rejected = 4;
}

service LedgerService {
  rpc Settle (SettleRequest) returns (SettledReply);
  rpc Open (SettleRequest) returns (SettledReply);
}