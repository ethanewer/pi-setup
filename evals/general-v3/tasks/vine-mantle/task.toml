schema_version = "1.4"

[metadata]
difficulty = "hard"
category = "security"
verifier_kind = "executes-deliverable"
deliverables = [
    "/app/solve.py",
    "/app/answer.json",
    "/app/result/creds.txt",
    "/app/dist/manta.jar",
    "/app/tls/portico.test.crt",
    "/app/tls/portico.test.key",
]
tags = [
    "vine-mantle",
    "security",
    "crypto-recovery",
    "password-hashing",
    "archive-cracking",
    "secret-sanitization",
    "filename-sanitization",
]

[verifier]
timeout_sec = 300.0

[agent]
timeout_sec = 3600.0

[environment]
build_timeout_sec = 600.0
cpus = 1
memory_mb = 2048
storage_mb = 4096