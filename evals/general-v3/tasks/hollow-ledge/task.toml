schema_version = "1.4"

[metadata]
difficulty = "hard"
category = "security"
verifier_kind = "executes-deliverable"
deliverables = [
  "/app/decode.c",
  "/app/creds.txt",
  "/app/key.pem",
]
tags = [
  "hollow-ledge", "security",
  "single-byte-wal-recover",
  "embedded-file-carving",
  "password-check-reversal",
  "recovered-credentials-output",
]

[verifier]
timeout_sec = 300.0

[agent]
timeout_sec = 1800.0

[environment]
build_timeout_sec = 600.0
cpus = 1
memory_mb = 2048
storage_mb = 4096