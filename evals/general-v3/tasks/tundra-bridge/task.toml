schema_version = "1.4"

[metadata]
difficulty = "hard"
category = "web"
verifier_kind = "executes-deliverable"
deliverables = [
  "/app/nginx.conf",
  "/app/site/index.html",
  "/app/tls/",
  "/app/network_fix.sh",
  "/app/selfcheck.py",
]
tags = [
  "tundra-bridge",
  "web",
  "nginx-http-server",
  "tls-certificate",
  "rate-limiting",
  "dns-hosts-resolution",
  "self-test-reporting",
]

[verifier]
timeout_sec = 300.0

[agent]
timeout_sec = 2400.0

[environment]
build_timeout_sec = 600.0
cpus = 1
memory_mb = 2048
storage_mb = 4096