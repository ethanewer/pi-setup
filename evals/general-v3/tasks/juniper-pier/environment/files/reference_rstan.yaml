# Existing RStan sampling configuration for the foundry calibration model.
# This is the run the material-science team already validated in R (rstan).
# PyStan must be configured with the *equivalent* semantics (see hparams.json).
chains: 4          # number of MCMC chains
iter: 2400         # total iterations PER CHAIN (warmup included)
warmup: 800        # adaptive warmup iterations PER CHAIN (discarded)
thin: 1
seed: 20260727
control:
  adapt_delta: 0.95
  max_treedepth: 10
  stepsize: 0.85