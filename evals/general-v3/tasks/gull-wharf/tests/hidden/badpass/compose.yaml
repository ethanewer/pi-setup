# Hidden scenario: WRONG password. Targets the live tidehouse database, but
# the compose file carries a bad credential. The program must fail (non-zero
# exit, no output file) instead of silently succeeding.
services:
  tidedb:
    image: postgres:16
    hostname: tidedb
    environment:
      POSTGRES_DB: tidehouse
      POSTGRES_USER: gauge_reader
      POSTGRES_PASSWORD: "Wrong-Pass-0000"
    ports:
      - "127.0.0.1:5544:5432"
    networks:
      default: {}
networks:
  default: {}
