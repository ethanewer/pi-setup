# Halden Grid -- metering stack description (compose-style).
# The `meters` service is a PostgreSQL instance provisioned for this exercise.
services:
  meters:
    image: postgres:17
    hostname: meters
    environment:
      POSTGRES_DB: gridstore
      POSTGRES_USER: meterd
      POSTGRES_PASSWORD: "Kestrel-Vane-2210"
    ports:
      - "5433:5432"
    networks:
      default: {}
    healthcheck:
      test: ["CMD", "pg_isready", "-h", "127.0.0.1", "-p", "5433"]
      interval: 5s
      timeout: 3s
      retries: 5
networks:
  default: {}
