schema_version = "1.4"

[metadata]
difficulty = "hard"
category = "scientific_computing"
verifier_kind = "executes-deliverable"
deliverables = [
  "/app/solve.py",
  "/app/answer.json",
  "/app/chess_state.pt",
]
tags = [
  "tundra-ledge",
  "scientific_computing",
  "relu-mlp-interrogation",
  "matrix-completion",
  "chessnet-statedict",
]

[verifier]
timeout_sec = 300.0

[agent]
timeout_sec = 1800.0

[environment]
build_timeout_sec = 600.0
cpus = 1
memory_mb = 2048
storage_mb = 4096