# Dead-reckoning buoy -- decommissioned stack (compose-style). Nothing is
# listening on the declared published port; the exporter must fail cleanly.
services:
  buoy:
    image: postgres:16
    environment:
      POSTGRES_DB: nowhere_db
      POSTGRES_USER: ghost
      POSTGRES_PASSWORD: "Salt-Fog-0000"
    ports:
      - "5999:5432"
