schema_version = "1.4"

[metadata]
difficulty = "hard"
category = "security"
verifier_kind = "executes-deliverable"
deliverables = [
  "/app/solve.py",
  "/app/candidates.txt",
  "/app/answer.json",
  "/app/creds.txt",
  "/app/vault.hash",
  "/app/scrub.py",
  "/app/upload/sanitizer.py",
  "/app/team",
]
tags = [
  "zephyr-engine", "security",
  "format-constraint-enumeration",
  "subkey-seed-search",
  "sha1-structural-count",
  "archive-hash-probe",
  "encrypted-7z-extract",
]

[verifier]
timeout_sec = 300.0

[agent]
timeout_sec = 2400.0

[environment]
build_timeout_sec = 600.0
cpus = 1
memory_mb = 2048
storage_mb = 4096