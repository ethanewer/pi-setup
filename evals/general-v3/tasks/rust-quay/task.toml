schema_version = "1.4"

[metadata]
difficulty = "medium"
category = "security"
verifier_kind = "executes-deliverable"
deliverables = [
  "/app/dewal.py",
  "/app/quay.db-wal",
  "/app/secrets.json",
]
tags = [
  "rust-quay", "security", "C-ce46ee62",
  "single-byte-xor-wal-recovery",
  "sqlite-wal-replay",
  "never-checkpointed-rows",
]

[verifier]
timeout_sec = 300.0

[agent]
timeout_sec = 900.0

[environment]
build_timeout_sec = 600.0
cpus = 1
memory_mb = 2048
storage_mb = 4096
