schema_version = "1.4"

[metadata]
difficulty = "medium"
category = "programming"
verifier_kind = "executes-deliverable"
deliverables = [
    "/app/workbook.ipynb",
    "/app/plugin.vim",
    "/app/topk.awk",
    "/app/filter.jq",
    "/app/pipeline.sh",
]
tags = ["gale-bridge", "programming", "jupyter-notebook", "vim", "awk", "jq", "shell-pipeline"]

[verifier]
timeout_sec = 300.0

[agent]
timeout_sec = 900.0

[environment]
build_timeout_sec = 600.0
cpus = 1
memory_mb = 2048
storage_mb = 4096