schema_version = "1.4"

[metadata]
difficulty = "medium"
category = "security"
verifier_kind = "executes-deliverable"
deliverables = [
    "/app/mkcert.py",
    "/app/identity/key.pem",
    "/app/identity/cert.pem",
    "/app/identity/bundle.pem",
    "/app/identity/fingerprint.txt",
]
tags = [
    "kiln-cipher",
    "security",
    "C-16147090",
    "tls-identity-bundle",
    "combined-pem",
]

[verifier]
timeout_sec = 300.0

[agent]
timeout_sec = 900.0

[environment]
build_timeout_sec = 600.0
cpus = 1
memory_mb = 2048
storage_mb = 4096
