# TLS identity staging spec (kiln-cipher fixture)

The artifact registry's mTLS identities are staged from this spec:

    common_name = "registry.internal"
    key_bits    = 2048

Provision the visible identity with:

    python3 /app/mkcert.py --cn registry.internal --bits 2048 --out-dir /app/identity

The staging directory `/app/staging/` is read-only from your point of view:
do not modify any file in it.
