schema_version = "1.4"

[metadata]
difficulty = "medium"
category = "programming"
verifier_kind = "executes-deliverable"
deliverables = [
    "/app/changelogger.py",
    "/app/release/bumps.json",
    "/app/release/core/CHANGELOG.md",
    "/app/release/app/CHANGELOG.md",
    "/app/release/tools/CHANGELOG.md",
]
tags = [
    "umbral-inlet",
    "programming",
    "conventional-commit-parser",
    "semver-bumps",
]

[verifier]
timeout_sec = 300.0

[agent]
timeout_sec = 1800.0

[environment]
build_timeout_sec = 600.0
cpus = 1
memory_mb = 2048
storage_mb = 4096