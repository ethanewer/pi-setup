syntax = "proto3";
package atlas.cluster;

/* Remote-procedure contract exposed by the AtlasRidge control-plane gateway.
   The service doubles as (a) a key/value store and (b) a cluster status
   endpoint that reports whether the cluster is online, its node roster, and
   its configured capacity. */

message PutReq {
  string key = 1;
  string value = 2;
}

message PutReply {
  bool ok = 1;
}

message GetReq {
  string key = 1;
}

message ValueMsg {
  string value = 1;
}

message StatusReq {
  // Any string the probe wants echoed back for provenance (used in detail).
  string probe_id = 1;
}

message StatusInfo {
  bool healthy = 1;
  string cluster = 2;
  repeated string nodes = 3;
  int64 capacity_bytes = 4;
  int64 objects = 5;
  string detail = 6;
}

service AtlasGateway {
  rpc Put(PutReq) returns (PutReply);
  rpc Get(GetReq) returns (ValueMsg);
  rpc Status(StatusReq) returns (StatusInfo);
}