<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Operations dashboard</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div id="app" class="app">
    <div class="shell">
      <header class="topbar">
        <h1>Operations dashboard</h1>
      </header>
      <aside class="sidebar">
        <h2>Alerts</h2>
        <div class="stat"><h3>Open</h3></div>
        <div class="stat"><h3>Watching</h3></div>
        <div class="stat"><h3>Resolved</h3></div>
      </aside>
      <main class="main">
        <div class="card-grid">
          <div class="card"><h3>Latency</h3></div>
          <div class="card"><h3>Throughput</h3></div>
          <div class="card"><h3>Error rate</h3></div>
          <div class="card"><h3>Queue depth</h3></div>
          <div class="card"><h3>Cache hits</h3></div>
          <div class="card"><h3>DB pool</h3></div>
          <div class="card"><h3>Ingress</h3></div>
          <div class="card"><h3>Egress</h3></div>
        </div>
      </main>
    </div>
  </div>
</body>
</html>
