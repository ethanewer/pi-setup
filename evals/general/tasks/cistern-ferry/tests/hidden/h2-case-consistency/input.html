<!-- hidden case 2: attribute-name casing must match between tags with and without per-element attribute data -->
<div ID="same" TITLE="same" HIDDEN>element with attribute data</div>
<p ID="same" TITLE="same" HIDDEN>element without attribute data</p>
<span DIR="auto" LANG="en" TRANSLATE="no">span</span>
<label FOR="f" DATA-CUSTOM="keep">label</label>
<input ID="f" TYPE="checkbox" CHECKED>
<pre TABINDEX="0">pre</pre>
<dt ID="term">term</dt>
<dd CLASS="defn">definition</dd>
<wbr HIDDEN>
<custom-widget CLASS="keep uppercase on unknown tags">custom</custom-widget>
