schema_version = "1.4"

[metadata]
difficulty = "medium"
category = "debugging"
verifier_kind = "executes-deliverable"
deliverables = [
    "/app/repro.sh",
    "/app/src",
]
tags = [
    "boom-ground",
    "debugging",
    "clean-room",
]

[verifier]
timeout_sec = 1200.0
network_mode = "no-network"

[agent]
timeout_sec = 2400.0
network_mode = "no-network"

[environment]
build_timeout_sec = 900.0
cpus = 1
memory_mb = 4096
storage_mb = 8192