schema_version = "1.4"

[metadata]
difficulty = "hard"
category = "data_science"
verifier_kind = "executes-deliverable"
deliverables = [
  "/app/reconstruct.py",
  "/app/triton_cpu.py",
  "/app/lt_triton_result.json",
  "/app/preds.csv",
  "/app/sample.csv",
  "/app/lowrank.npz",
  "/app/model/adapter_config.json",
  "/app/model/state_dict.pt",
  "/app/model/arch.json",
]
tags = [
  "elm-terrace",
  "data_science",
  "reconstruct-architecture-from-state-dict",
  "configure-lora-for-causal-model",
  "sample-dataset-from-intervened-model",
  "out-of-sample-predictions",
  "low-rank-model-factors",
  "triton-cpu-interpreter-kernels",
  "keep-model-under-size-budget",
]

[verifier]
timeout_sec = 300.0

[agent]
timeout_sec = 1800.0

[environment]
build_timeout_sec = 600.0
cpus = 1
memory_mb = 2048
storage_mb = 4096