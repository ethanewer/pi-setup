schema_version = "1.4"

[metadata]
difficulty = "medium"
category = "security"
verifier_kind = "executes-deliverable"
deliverables = ["/app/certinspect.py", "/app/cert.pem", "/app/key.pem", "/app/cert-report.json"]
tags = ["plum-seal", "security", "x.509", "certificate-inspection", "pem-handling", "expiry-validation"]

[verifier]
timeout_sec = 300.0

[agent]
timeout_sec = 1200.0

[environment]
build_timeout_sec = 600.0
cpus = 1
memory_mb = 2048
storage_mb = 4096
