schema_version = "1.4"

[metadata]
difficulty = "hard"
category = "data_processing"
verifier_kind = "executes-deliverable"
deliverables = [
    "/app/db/start.sh",
    "/app/db/migrate/forward.sql",
    "/app/db/migrate/backward.sql",
    "/app/queries/report.sql",
]
tags = ["thwart-cinder", "data_processing", "clean-room"]

[verifier]
timeout_sec = 1500.0

[agent]
timeout_sec = 2400.0

[environment]
build_timeout_sec = 1800.0
cpus = 1
memory_mb = 4096
storage_mb = 8192