schema_version = "1.4"

[metadata]
difficulty = "medium"
category = "system_administration"
verifier_kind = "executes-deliverable"
deliverables = [
  "/app/run_guest.sh",
  "/app/guest.qcow2",
  "/app/forward_check.log",
  "/app/guest_daemon.pid",
  "/app/restore_curl.sh",
  "/app/fetch_result.html",
]
tags = [
  "basalt-bridge",
  "system_administration",
  "qemu-user-mode-hostfwd",
  "background-emulator-daemonize",
  "curl-binary-integrity-restore",
]

[verifier]
timeout_sec = 300.0

[agent]
timeout_sec = 1200.0

[environment]
build_timeout_sec = 600.0
cpus = 1
memory_mb = 2048
storage_mb = 4096