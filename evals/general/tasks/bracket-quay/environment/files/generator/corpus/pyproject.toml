[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "quaydoc"
version = "0.9.0"
description = "A self-contained documentation site generator with a small markup language"
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
authors = [{name = "The Quaydoc Authors"}]
keywords = ["documentation", "static-site", "markup", "docs"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3",
  "Topic :: Documentation",
  "Topic :: Text Processing :: Markup",
]

[project.scripts]
quaydoc = "quaydoc.cli:main"

[tool.setuptools.packages.find]
include = ["quaydoc*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
