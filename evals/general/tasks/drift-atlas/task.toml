schema_version = "1.4"

[metadata]
difficulty = "hard"
category = "scientific_computing"
verifier_kind = "executes-deliverable"
deliverables = [
    "/app/neuron.py",
    "/app/channels.py",
    "/app/spike-trace.json",
    "/app/descriptors.py",
    "/app/descriptors.json",
    "/app/ref-model.xml",
    "/app/tuned-model.xml",
    "/app/mujoco-load.txt",
    "/app/warrior.red",
    "/app/tournament.json",
    "/app/sizes.json",
]
tags = [
    "drift-atlas",
    "scientific_computing",
    "neuron-channel-gating",
    "somatic-spike-trace",
    "rdkit-descriptors-typed",
    "redcode-warrior-tournament",
    "mujoco-plugin-free-tuning",
    "artifact-size-bounds",
]

[verifier]
timeout_sec = 300.0

[agent]
timeout_sec = 1800.0

[environment]
build_timeout_sec = 600.0
cpus = 1
memory_mb = 2048
storage_mb = 4096