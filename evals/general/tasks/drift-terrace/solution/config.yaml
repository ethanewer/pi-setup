# drift-terrace training config (canonical, visible case). Every path and
# tuning knob used by /app/train.py is taken from here so the same program
# runs unchanged on a fresh dataset provided at run time.
data:
  path: /app/company.csv
  target_column: churn
  drop_columns: []
  id_column: null
model:
  reg_strength: 0.05
  max_iter: 400
optim:
  driver_feature: driver_price
  bound_epsilon: 0.0001
split:
  seed: 812
  n_folds: 5
  held_out_fold: 4
evaluate:
  accuracy_floor: 0.820
debug:
  one_epoch: false
output:
  dir: /app
  model_file: model.joblib
  vector_file: vector.out
  log_dir: /app/experiment-data
  progress_file: progress.log