schema_version = "1.4"

[metadata]
difficulty = "medium"
category = "data_processing"
verifier_kind = "executes-deliverable"
deliverables = [
    "/app/ocr.py",
    "/app/invoice-labels.json",
    "/app/field-map.py",
    "/app/field-map.json",
    "/app/retrieval-stats.json",
    "/app/chess-read.py",
    "/app/positions.json",
    "/app/extract.py",
    "/app/profiles.json",
]
tags = [
    "brisk-anchor",
    "data_processing",
    "ocr-invoice-classification",
    "retrieval-field-mapping",
    "chess-position-from-image",
    "regex-profile-extraction",
]

[verifier]
timeout_sec = 300.0

[agent]
timeout_sec = 1200.0

[environment]
build_timeout_sec = 600.0
cpus = 1
memory_mb = 2048
storage_mb = 4096