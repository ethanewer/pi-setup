schema_version = "1.4"

[metadata]
difficulty = "medium"
category = "debugging"
verifier_kind = "executes-deliverable"
deliverables = [
    "/app/freezegun_base/freezegun/api.py",
    "/app/reproduce.py",
]
tags = ["freezegun-issue-repair", "debugging", "python", "decorator", "regression"]

[verifier]
timeout_sec = 120.0

[agent]
timeout_sec = 900.0

[environment]
build_timeout_sec = 300.0
network_mode = "no-network"
cpus = 1
memory_mb = 4096
storage_mb = 4096
