schema_version = "1.4"

[metadata]
difficulty = "medium"
category = "debugging"
verifier_kind = "executes-deliverable"
deliverables = ["/app/src", "/app/reproduce.py", "/app/summary.md"]
tags = ["lazaret-careen", "debugging", "clean-room"]

[verifier]
timeout_sec = 600.0

[agent]
timeout_sec = 2400.0

[environment]
# The trial MUST be offline: this task ships a shallow clone holding ONLY the
# parent commit, and the fix commit must not be fetchable, or the agent could
# read the answer with `git fetch origin <fix-sha>` / curl instead of doing
# the debugging. Mirror of the v4.2 sibling tasks (e.g. capstan-foresheet):
# without this declaration the harness default is PUBLIC egress. Enforced
# (deny-all) for both agent and verifier phases, which inherit this baseline
# unless overridden.
network_mode = "no-network"
build_timeout_sec = 1200.0
cpus = 1
memory_mb = 4096
storage_mb = 8192