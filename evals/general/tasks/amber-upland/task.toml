schema_version = "1.4"

[metadata]
difficulty = "hard"
category = "system_administration"
verifier_kind = "executes-deliverable"
deliverables = [
  "/app/initramfs.gz",
  "/app/boot.sh",
  "/app/vnc.conf",
]
tags = [
  "amber-upland",
  "system_administration",
  "C-0f47404f",
  "C-a6729997",
  "C-d7f631d3",
]

[verifier]
# Headroom for TCG qemu boot under host contention: test.sh self-terminates
# (writes 0) at its own 450s internal deadline, so this window is never fully
# consumed even by a pathological deliverable, but legitimately slow-but-
# passing runs are not killed mid-verification.
timeout_sec = 600.0

[agent]
timeout_sec = 1800.0

[environment]
build_timeout_sec = 600.0
cpus = 1
memory_mb = 2048
storage_mb = 4096