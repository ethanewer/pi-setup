schema_version = "1.4"

[metadata]
difficulty = "hard"
category = "system_administration"
verifier_kind = "executes-deliverable"
deliverables = [
    "/app/provision.sh",
    "/app/env/.venv",
    "/app/pinned.txt",
]
tags = [
    "gale-fathom",
    "system_administration",
    "venv-install-pinned-package",
    "install-pinned-miniconda",
    "conda-env-python-version",
    "noninteractive-package-install",
    "install-from-local-index",
    "verify-pip-install",
    "self-contained-python-env",
    "uv-project",
    "conda-autoactivation",
]

[verifier]
timeout_sec = 900.0

[agent]
timeout_sec = 1800.0

[environment]
build_timeout_sec = 600.0
cpus = 1
memory_mb = 2048
storage_mb = 4096
