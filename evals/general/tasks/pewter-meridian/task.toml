schema_version = "1.4"

[metadata]
difficulty = "medium"
category = "data_processing"
verifier_kind = "executes-deliverable"
deliverables = [
    "/app/build_declaration.py",
    "/app/declaration.csv",
    "/app/validation_report.json",
]
tags = [
    "pewter-meridian",
    "data_processing",
    "declaration",
    "validation",
]

[verifier]
timeout_sec = 300.0

[agent]
timeout_sec = 1800.0

[environment]
build_timeout_sec = 600.0
cpus = 1
memory_mb = 2048
storage_mb = 4096