schema_version = "1.4"

[metadata]
difficulty = "medium"
category = "security"
verifier_kind = "executes-deliverable"
deliverables = [
  "/app/workspace",
  "/app/remote/tally.git",
  "/app/workspace-h1",
  "/app/remote/stockpile.git",
  "/app/workspace-h2",
  "/app/remote/gatewatch.git",
]
tags = ["thwart-lantern", "security", "clean-room"]

[verifier]
timeout_sec = 600.0

[agent]
timeout_sec = 2400.0

[environment]
build_timeout_sec = 900.0
cpus = 1
memory_mb = 2048
storage_mb = 4096