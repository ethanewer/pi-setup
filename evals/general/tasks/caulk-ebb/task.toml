schema_version = "1.4"

[metadata]
difficulty = "medium"
category = "debugging"
verifier_kind = "executes-deliverable"
deliverables = [
    "/app/src",
    "/app/reproduce_failure.py",
]
tags = [
    "caulk-ebb",
    "debugging",
    "clean-room",
]

[verifier]
timeout_sec = 600.0
network_mode = "no-network"

[agent]
timeout_sec = 2400.0
network_mode = "no-network"

[environment]
build_timeout_sec = 1800.0
cpus = 1
memory_mb = 4096
storage_mb = 8192