schema_version = "1.4"

[metadata]
difficulty = "hard"
category = "scientific_computing"
verifier_kind = "executes-deliverable"
deliverables = [
    "/app/solve_mip.py",
    "/app/mip_result.json",
    "/app/corners.py",
    "/app/corners.txt",
    "/app/quartic_min.py",
    "/app/quartic_solution.json",
    "/app/sinkhorn.py",
    "/app/ot_cost.json",
]
tags = ["umber-terrace", "scientific_computing", "mip", "corners", "quartic", "sinkhorn"]

[verifier]
timeout_sec = 300.0

[agent]
timeout_sec = 1800.0

[environment]
build_timeout_sec = 600.0
cpus = 1
memory_mb = 2048
storage_mb = 4096