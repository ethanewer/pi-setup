category = "security"
verifier_kind = "executes-deliverable"
deliverables = ["/app/keygen.sh", "/app/deploy_key.pem"]
tags = [
    "sorrel-hasp",
    "security",
    "C-2d0e9195",
    "rsa-keygen",
    "key-hardening",
    "file-permissions",
]

[verifier]
