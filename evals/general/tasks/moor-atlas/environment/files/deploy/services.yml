# Moor Atlas Survey -- provisioned service stack (compose-style).
# The `watch` service is the authoritative PostgreSQL beacon registry for this
# exercise; it listens on 127.0.0.1 at the HOST port published below.
services:
  watch:
    image: postgres:16
    hostname: watch
    environment:
      POSTGRES_DB: moorside
      POSTGRES_USER: surveyor
      POSTGRES_PASSWORD: "Torren-Feil-3319"
    ports:
      - "5581:5432"
  cartographer:
    image: busybox:1.36
    command: ["sleep", "infinity"]
