# Reedhaven Naturalist Society -- canonical listd configuration.
# Installed at /etc/listd/config.toml by /app/provision.sh.

[site]
domain = "reedhaven.example"
owner = "keeper@reedhaven.example"

# Closed announcement list: full historical roster from the source file,
# moderated by the keeper. Subscribe attempts are refused (closed).
[[list]]
name = "heron-announce"
members = [
  "ada.l@example.net",
  "grace@hopper.example",
  "linm@pond.example",
  "tide-fan42@stream.example",
  "keeper@reedhaven.example",
]
moderators = ["keeper@reedhaven.example"]
open = false
max_members = 40

# Open discussion list: two seed members, hard cap of 3 members.
[[list]]
name = "tide-chat"
members = [
  "grace@hopper.example",
  "tide-fan42@stream.example",
]
moderators = ["keeper@reedhaven.example"]
open = true
max_members = 3
