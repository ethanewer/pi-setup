schema_version = "1.4"

[metadata]
difficulty = "hard"
category = "security"
verifier_kind = "executes-deliverable"
deliverables = ["/app/crack.py", "/app/secret.json"]
tags = [
  "pearl-cipher",
  "C-fdb58e16",
  "security",
  "cipher-preimage-search-time-budget",
  "vectorized-block-space-enumeration",
  "chosen-plaintext-bounded-query",
]

[verifier]
timeout_sec = 420.0

[agent]
timeout_sec = 1800.0

[environment]
build_timeout_sec = 600.0
cpus = 2
memory_mb = 4096
storage_mb = 4096
