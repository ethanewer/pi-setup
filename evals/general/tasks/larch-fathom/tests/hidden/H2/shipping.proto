// shipping.proto -- a fresh RPC surface for logistics (hidden case).
// Exercises oneof, an enum, an embedded message, and a client-streaming rpc
// so the generated bindings differ structurally from the visible ledger.proto.
syntax = "proto3";
package shipping;

enum Size {
  SZ_UNSPECIFIED = 0;
  SZ_S = 1;
  SZ_L = 2;
}

message Item {
  string sku = 1;
  int32 qty = 2;
  Size size = 3;
}

message Container {
  string tag = 1;
  oneof seal {
    string barcode = 2;
    bytes chip = 3;
  }
  repeated Item contents = 4;
  fixed64 eta = 5;
}

message TrackingReply {
  string shipment_id = 1;
  bool moving = 2;
  string location = 3;
}

service ShippingService {
  rpc Track (Container) returns (TrackingReply);
  rpc StreamStatus (stream Container) returns (TrackingReply);
}