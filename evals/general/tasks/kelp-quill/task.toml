schema_version = "1.4"

[metadata]
difficulty = "medium"
category = "security"
verifier_kind = "executes-deliverable"
deliverables = [
    "/app/keys/deploy_key.pem",
    "/app/keys/deploy_key.pub",
    "/app/keyreport.py",
    "/app/deploy-report.json",
]
tags = [
    "kelp-quill",
    "security",
    "C-2d0e9195",
    "rsa-2048-keygen",
    "private-key-permissions",
    "pem-key-inspection",
]

[verifier]
timeout_sec = 300.0

[agent]
timeout_sec = 600.0

[environment]
build_timeout_sec = 600.0
cpus = 1
memory_mb = 2048
storage_mb = 4096
