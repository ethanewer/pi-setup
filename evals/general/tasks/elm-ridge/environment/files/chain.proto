// Ridgeline Systems internal chain-query protocol.
// Do not edit this file.
syntax = "proto3";

package chainlink;

message QueryRequest {
  string chain_id = 1;
  int32 n = 2;
}

message QueryReply {
  string hash = 1;
}

service ChainService {
  rpc Resolve(QueryRequest) returns (QueryReply);
}
