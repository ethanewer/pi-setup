schema_version = "1.4"

[metadata]
difficulty = "hard"
category = "security"
verifier_kind = "executes-deliverable"
deliverables = ["/app/solve.py", "/app/answer.json"]
tags = ["sage-wharf", "security", "reverse-obfuscated-content", "range-coding-scheme", "wal-transform-detection", "multi-step-digest"]

[verifier]
timeout_sec = 300.0

[agent]
timeout_sec = 1800.0

[environment]
build_timeout_sec = 600.0
cpus = 1
memory_mb = 2048
storage_mb = 4096
