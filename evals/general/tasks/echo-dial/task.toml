schema_version = "1.4"

[metadata]
difficulty = "medium"
category = "security"
verifier_kind = "executes-deliverable"
deliverables = [
  "/app/attack.py",
  "/app/name.txt",
  "/app/plaintexts.txt",
  "/app/word.txt",
]
tags = [
  "echo-dial",
  "security",
  "encoded-file-locating",
  "base64-name-decode",
  "secret-word-extract",
]

[verifier]
timeout_sec = 300.0

[agent]
timeout_sec = 900.0

[environment]
build_timeout_sec = 600.0
cpus = 1
memory_mb = 2048
storage_mb = 4096
