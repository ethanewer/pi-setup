schema_version = "1.4"

[metadata]
difficulty = "medium"
category = "programming"
verifier_kind = "executes-deliverable"
deliverables = [
  "/app/package.json",
  "/app/packages/core/package.json",
  "/app/packages/scale/package.json",
  "/app/packages/api/package.json",
  "/app/packages/api/dist/index.d.ts",
]
tags = ["jib-stave", "programming", "clean-room"]

[verifier]
timeout_sec = 600.0

[agent]
timeout_sec = 2400.0

[environment]
build_timeout_sec = 1800.0
cpus = 1
memory_mb = 4096
storage_mb = 8192