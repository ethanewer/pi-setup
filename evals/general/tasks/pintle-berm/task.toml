schema_version = "1.4"

[metadata]
difficulty = "medium"
category = "debugging"
verifier_kind = "executes-deliverable"
deliverables = [
    "/app/src",
    "/app/report.md",
]
tags = [
    "pintle-berm",
    "debugging",
    "clean-room",
]

[verifier]
timeout_sec = 600.0
network_mode = "no-network"

[agent]
timeout_sec = 3600.0
network_mode = "no-network"

[environment]
build_timeout_sec = 1800.0
cpus = 1
memory_mb = 4096
storage_mb = 8192