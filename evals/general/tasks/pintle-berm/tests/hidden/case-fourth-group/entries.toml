# Hidden case C: four capture groups and a longer haystack (an extra optional
# trailing group after the suffix), so the reported span must be longer than
# any of the upstream regression cases.
[[test]]
name = "hidden-fourth-group"
regex = '(?:(\d+)[:.])?(\d{1,2})[:.](\d{2})(?:[:.](\d{2}))?'
haystack = '102:12:39:40'
matches = [[[0, 12], [0, 3], [4, 6], [7, 9], [10, 12]]]