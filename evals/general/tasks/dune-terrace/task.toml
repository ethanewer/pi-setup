schema_version = "1.4"

[metadata]
difficulty = "hard"
category = "scientific_computing"
verifier_kind = "executes-deliverable"
deliverables = [
    "/app/make_icon.py",
    "/app/ptrace.c",
    "/app/scene_color.pfm",
    "/app/scene_depth.pgm",
    "/app/out.png"
]
tags = [
    "dune-terrace",
    "scientific-computing",
    "portable-network-graphic-generation",
    "offscreen-scene-rendering",
    "compact-c-path-tracing"
]

[verifier]
timeout_sec = 300.0

[agent]
timeout_sec = 1800.0

[environment]
build_timeout_sec = 600.0
cpus = 1
memory_mb = 2048
storage_mb = 4096