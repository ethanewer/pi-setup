schema_version = "1.4"

[metadata]
difficulty = "hard"
category = "security"
verifier_kind = "executes-deliverable"
deliverables = [
  "/app/carve.py",
  "/app/report.json",
  "/app/recovered",
]
tags = [
  "ember-quill", "security", "C-38bb2e3e",
  "qsfs-snapshot-carving",
  "deleted-file-recovery",
  "byte-exact-materialization",
  "crc-version-selection",
]

[verifier]
timeout_sec = 300.0

[agent]
timeout_sec = 1800.0

[environment]
build_timeout_sec = 600.0
cpus = 1
memory_mb = 2048
storage_mb = 4096
