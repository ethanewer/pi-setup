[web_api]
type = http
host = api.example.com
port = 8080
path = /health
interval = 30
timeout = 5

[database]
type = tcp
host = 192.168.1.100
port = 5432
interval = 60
timeout = 3

[load_balancer]
type = http
host = lb.example.com
port = 80
path = /status
interval = 45
timeout = 4

[mail_server]
type = tcp
host = mail.example.com
port = 25
interval = 120
timeout = 10

[dns_resolver]
type = dns
host = google.com
interval = 300
timeout = 5

[internal_api]
type = http
host = internal-api.example.com
port = 5000
path = /api/health
interval = 15
timeout = 2