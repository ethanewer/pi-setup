schema_version = "1.4"

[metadata]
difficulty = "medium"
category = "security"
verifier_kind = "executes-deliverable"
deliverables = [
    "/app/provision_key.sh",
    "/app/secrets/signer.pem",
    "/app/secrets/signer.pub",
    "/app/secrets/fingerprint.txt",
]
tags = [
    "quench-lantern",
    "security",
    "rsa-key-generation",
    "key-permissions",
    "pem-handling",
    "C-2d0e9195",
]

[verifier]
timeout_sec = 300.0

[agent]
timeout_sec = 900.0

[environment]
build_timeout_sec = 600.0
cpus = 1
memory_mb = 2048
storage_mb = 4096
