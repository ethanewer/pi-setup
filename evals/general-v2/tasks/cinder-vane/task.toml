schema_version = "1.4"

[metadata]
difficulty = "easy"
category = "data_science"
verifier_kind = "executes-deliverable"
deliverables = [
    "/app/train.py",
    "/app/config.yaml",
    "/app/mode/standard.yaml",
    "/app/mode/debug.yaml",
    "/app/report.json",
    "/app/model.json",
    "/app/report_debug.json",
    "/app/model_debug.json",
]
tags = ["cinder-vane", "data_science", "C-4d2f3c04", "hydra-config-groups", "debug-mode-override", "reproducible-training"]

[verifier]
timeout_sec = 300.0

[agent]
timeout_sec = 900.0

[environment]
build_timeout_sec = 600.0
cpus = 1
memory_mb = 2048
storage_mb = 4096
