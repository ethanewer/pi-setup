schema_version = "1.4"

[metadata]
difficulty = "hard"
category = "system_administration"
verifier_kind = "executes-deliverable"
deliverables = [
    "/app/session.log",
    "/app/daemons.pid",
    "/app/debug.txt",
    "/app/sudo.txt",
    "/app/analyze_events.py",
    "/app/step_trace.py",
    "/app/monitor.py",
]
tags = [
    "drift-summit",
    "system_administration",
    "daemon-management",
    "tmux-orchestration",
    "debugger-automation",
    "log-analysis",
    "sudo-enumeration",
]

[verifier]
timeout_sec = 300.0

[agent]
timeout_sec = 1800.0

[environment]
build_timeout_sec = 600.0
cpus = 1
memory_mb = 2048
storage_mb = 4096