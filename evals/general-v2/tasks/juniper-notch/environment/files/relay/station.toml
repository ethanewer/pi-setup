# Juniper Notch relay-station configuration
# This file is read by the relay worker and the survey gate at startup.
[relay]
name = "juniper-notch-77"
zone = "siskiyou"

# The task inbox is carried by a lightweight MQ v3.1.1 bus.
# Cluster nodes reach it over loopback; no credentials are required.
[bus]
protocol = "mqtt"
host = "127.0.0.1"
port = 31883
anonymous = true
inbox_topic = "juniper/jobs"

# The survey gate is a raw TCP text server (one request per turn).
[gate]
host = "127.0.0.1"
port = 43979