category = "programming"
verifier_kind = "executes-deliverable"
deliverables = [
  "/app/ckpt_reader.c",
  "/app/ckpt_reader",
  "/app/generate.py",
  "/app/greedy_out.json",
  "/app/speculative.py",
  "/app/spec_out.json",
  "/app/retrieve.py",
  "/app/ranks.json",
  "/app/model.pkl",
  "/app/params.json",
]
tags = [
  "vine-pier",
  "programming",
  "checkpoint-read-from-c",
  "greedy-sequence-generation",
  "speculative-draft-verify",
  "pinned-revision-retrieval",
  "pickle-model-persist",
