schema_version = "1.4"

[metadata]
difficulty = "medium"
category = "system_administration"
verifier_kind = "executes-deliverable"
deliverables = [
    "/app/requirements.txt",
    "/app/environment.lock",
    "/app/.zshrc",
    "/app/confirm_versions.py",
]
tags = ["umber-anchor", "system_administration", "dependency-version-declaration", "dependency-conflict-resolution", "zsh-framework-config"]

[verifier]
timeout_sec = 600.0

[agent]
timeout_sec = 1200.0

[environment]
build_timeout_sec = 600.0
cpus = 1
memory_mb = 2048
storage_mb = 4096