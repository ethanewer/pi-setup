schema_version = "1.4"

[metadata]
difficulty = "hard"
category = "programming"
verifier_kind = "executes-deliverable"
deliverables = [
    "/app/splash.py",
    "/app/splash.txt",
    "/app/frame-report.json",
]
tags = [
    "onyx-frame",
    "programming",
    "binary-re",
    "C-2e1c650a",
    "gzip-size-ceiling",
    "arithmetic-frame-renderer",
]

[verifier]
timeout_sec = 300.0

[agent]
timeout_sec = 900.0

[environment]
build_timeout_sec = 600.0
cpus = 1
memory_mb = 2048
storage_mb = 4096
