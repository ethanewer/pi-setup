# arid-hearth list configuration
#
# `policy` controls the membership join rule. Recognized values
# (case-sensitive): closed | open-auto | open-confirm
#
#   closed       : no one may subscribe through automation.
#   open-auto    : subscribing immediately makes the address an active member
#                  (no confirmation step).
#   open-confirm : anyone may subscribe (open), but the address stays PENDING
#                  until it confirms with the one-time token it receives
#                  (an "open-but-confirm" policy).
policy = unset