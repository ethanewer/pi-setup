schema_version = "1.4"

[metadata]
difficulty = "hard"
category = "data_science"
verifier_kind = "executes-deliverable"
deliverables = [
    "/app/vocab.txt",
    "/app/build_vocab.py",
    "/app/tokenizer/bpe.model",
    "/app/build_tokenizer.py",
    "/app/train.py",
    "/app/predict.py",
    "/app/classifier_snapshot.npz",
    "/app/eval_metrics.json",
]
tags = ["flint-cipher", "data_science", "C-6d088405", "C-440b0d41", "C-f9ae04c3"]

[verifier]
timeout_sec = 300.0

[agent]
timeout_sec = 1200.0

[environment]
build_timeout_sec = 600.0
cpus = 1
memory_mb = 2048
storage_mb = 4096