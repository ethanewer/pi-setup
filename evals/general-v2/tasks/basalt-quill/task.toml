schema_version = "1.4"

[metadata]
difficulty = "hard"
category = "scientific_computing"
verifier_kind = "executes-deliverable"
deliverables = [
    "/app/fit_spectra.py",
    "/app/fit_results.json",
    "/app/stack_models.py",
    "/app/separability.json",
    "/app/cross_entropy_opt.py",
    "/app/ars.R",
    "/app/sample.csv",
]
tags = [
    "basalt-quill",
    "scientific_computing",
    "lorentzian-spectral-fitting",
    "compound-model-separability",
    "cross-entropy-optimization",
    "adaptive-rejection-sampling",
]

[verifier]
timeout_sec = 300.0

[agent]
timeout_sec = 2700.0

[environment]
build_timeout_sec = 600.0
cpus = 1
memory_mb = 3072
storage_mb = 4096