# Sedgevault Field Archive -- component stack description (compose-style).
#
# The `specimen-db` service is the PostgreSQL instance provisioned for this
# exercise. It listens on loopback (127.0.0.1) at the PUBLISHED port shown in
# its `ports:` entry (the first number of the HOST:CONTAINER mapping; the
# container-side port is 5432).
services:
  specimen-db:
    image: postgres:16
    hostname: specimen-db
    environment:
      POSTGRES_DB: herbarium
      POSTGRES_USER: curator
      POSTGRES_PASSWORD: "Fenwick-Alder-914"
    ports:
      - "5541:5432"
