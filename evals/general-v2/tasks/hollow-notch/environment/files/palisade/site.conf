# Palisade cluster "core" descriptor (default site the operator must provision).
# Format: one key = value per line; '#' starts a comment; empty lines ignored.
# host        must be a plain DNS hostname/FQDN (letters, digits, '-', '.')
# primary_port   RPC port the primary node answers status queries on
# data_port      RPC port of the data node
# secondary_port RPC port of the secondary (standby) node
# capacity_mb  per-node configured capacity in mebibytes (aggregated across the
#              three nodes for the cluster's reported capacity in bytes)

host=palisade-core.hollow.farm
primary_port=26100
data_port=26101
secondary_port=26102
capacity_mb=65536
