schema_version = "1.4"

[metadata]
difficulty = "medium"
category = "programming"
verifier_kind = "executes-deliverable"
deliverables = [
    "/app/grid.py",
    "/app/algo.py",
    "/app/squares.py",
    "/app/map.txt",
]
tags = [
    "prism-pier",
    "programming",
    "grid-expansion",
    "map-emission",
    "session-finalization",
    "arc-transform",
    "maximal-square",
]

[verifier]
timeout_sec = 300.0

[agent]
timeout_sec = 900.0

[environment]
build_timeout_sec = 600.0
cpus = 1
memory_mb = 2048
storage_mb = 4096