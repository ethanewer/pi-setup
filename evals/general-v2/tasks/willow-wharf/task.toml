schema_version = "1.4"

[metadata]
difficulty = "medium"
category = "scientific_computing"
verifier_kind = "executes-deliverable"
deliverables = [
  "/app/proof.v",
  "/app/proof-check.log",
  "/app/integral.py",
  "/app/integral.txt",
  "/app/sampler.R",
  "/app/selftest.log",
  "/app/report.tex",
  "/app/report.pdf",
  "/app/pdflatex.log",
]
tags = [
  "willow-wharf",
  "scientific_computing",
  "complete-an-incomplete-coq-proof-by-induction",
  "produce-a-proof-with-no-admitted-obligations",
  "symbolically-integrate-and-simplify-the-definite-integral-with-sympy",
  "expose-required-entry-point-functions-under-required-names",
  "make-a-successful-pdflatex-build-free-of-over-filled-box-warnings",
]

[verifier]
timeout_sec = 300.0

[agent]
timeout_sec = 1200.0

[environment]
build_timeout_sec = 600.0
cpus = 1
memory_mb = 2048
storage_mb = 4096