schema_version = "1.4"

[metadata]
difficulty = "hard"
category = "data_processing"
verifier_kind = "executes-deliverable"
deliverables = [
  "/app/solve.py",
  "/app/schema.sql",
  "/app/recovered.db",
  "/app/salvage.json",
  "/app/summary.sql",
  "/app/fixed_query.sql",
  "/app/import_log.txt",
]
tags = [
  "flint-terrace",
  "data_processing",
  "client-copy-load",
  "truncated-sqlite-salvage",
  "aggregate-having-filter",
  "domain-attribute-filter",
  "wal-replay",
  "sqlite-dialect-rewrite",
  "prescribed-schema",
]

[verifier]
timeout_sec = 300.0

[agent]
timeout_sec = 1800.0

[environment]
build_timeout_sec = 600.0
cpus = 1
memory_mb = 2048
storage_mb = 4096