# Hidden scenario: a SECOND postgres cluster on a DIFFERENT published port,
# with its own role, password, and data. The program must take the host port
# from this compose file (5591), not assume the visible 5544.
services:
  coldpool:
    image: postgres:16
    hostname: coldpool
    environment:
      POSTGRES_DB: coldpool
      POSTGRES_USER: pool_probe
      POSTGRES_PASSWORD: "Cold-Run-3388"
    ports:
      - "127.0.0.1:5591:5432"
    networks:
      default: {}
networks:
  default: {}
