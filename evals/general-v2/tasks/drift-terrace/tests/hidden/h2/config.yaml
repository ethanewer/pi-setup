data:
  path: /tests/hidden/h2/data.csv
  target_column: retained
  drop_columns: [velocity_brand, junk_note]
  id_column: null
model:
  reg_strength: 0.02
  max_iter: 400
optim:
  driver_feature: driver_offset
  bound_epsilon: 0.0001
split:
  seed: 33
  n_folds: 4
  held_out_fold: 3
evaluate:
  accuracy_floor: 0.780
debug:
  one_epoch: false
output:
  dir: /tmp/rh2
  model_file: model.joblib
  vector_file: vector.out
  log_dir: /tmp/rh2_logs
  progress_file: progress.log