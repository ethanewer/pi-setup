schema_version = "1.4"

[metadata]
difficulty = "hard"
category = "scientific_computing"
verifier_kind = "executes-deliverable"
deliverables = [
  "/app/train.py",
  "/app/model.joblib",
  "/app/vector.out",
  "/app/config.yaml",
]
tags = [
  "drift-terrace",
  "scientific_computing",
  "signed-constraint-logistic",
  "config-driven-paths",
  "persist-program-result",
  "model-accuracy-floor",
  "self-test-reporting",
]

[verifier]
timeout_sec = 300.0

[agent]
timeout_sec = 1800.0

[environment]
build_timeout_sec = 600.0
cpus = 1
memory_mb = 2048
storage_mb = 4096